[project]
name = "regulated-agent-launch-kit"
version = "0.1.0"
description = "Synthetic regulated embedded-finance deployment-readiness kit for multi-agent evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
]
eval = [
  "braintrust>=0.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
